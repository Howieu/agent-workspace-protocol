<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-labelledby="branch-title branch-desc">
<title id="branch-title">分支与 main</title>
<desc id="branch-desc">spec 在 main 上确认后开功能分支，分支上逐个任务提交并勾验收，HANDOFF 只在 main 提交，验收后合并回 main。</desc>
<style>
svg{--ink:#1f2328;--mut:#59636e;--line:#d1d9e0;--flow:#1a7f37;--uf:#fbefff;--us:#8250df;--ut:#512a97;--af:#dafbe1;--as:#1a7f37;--at:#0f5323;--gf:#f6f8fa;--gs:#d1d9e0}
@media (prefers-color-scheme:dark){svg{--ink:#f0f6fc;--mut:#9198a1;--line:#3d444d;--flow:#3fb950;--uf:#271a3f;--us:#a371f7;--ut:#e2d1ff;--af:#0f2a1a;--as:#3fb950;--at:#aff5b4;--gf:#151b23;--gs:#3d444d}}
text{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;dominant-baseline:central}
.t{font-size:14px;font-weight:600}.s{font-size:12px}
.u rect{fill:var(--uf);stroke:var(--us)}.u .t{fill:var(--ut)}.u .s{fill:var(--us)}
.a rect{fill:var(--af);stroke:var(--as)}.a .t{fill:var(--at)}.a .s{fill:var(--as)}
.g rect{fill:var(--gf);stroke:var(--gs)}.g .t{fill:var(--ink)}.g .s{fill:var(--mut)}
rect{stroke-width:1}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.f{fill:none;stroke:var(--flow);stroke-width:2;stroke-dasharray:6 8;animation:flow 1s linear infinite}
.n{animation:pulse 7.2s ease-in-out infinite both}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:.55}4%,10%{opacity:1}14%,99%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.f,.n{animation:none;opacity:1}}
.lg{font-size:12px;fill:var(--mut);text-anchor:start}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--mut)" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<path d="M40 70H640" style="fill:none;stroke:var(--mut);stroke-width:2"/>
<path d="M170 70C200 70 200 150 240 150H470C510 150 510 70 540 70" style="fill:none;stroke:var(--as);stroke-width:2"/>
<path class="f" d="M170 70C200 70 200 150 240 150H470C510 150 510 70 540 70"/>
<text class="s" x="40" y="96" style="fill:var(--mut);text-anchor:start">main</text>
<text class="s" x="240" y="196" style="fill:var(--as);text-anchor:start">feat/x（worktree）</text>
<g class="a"><circle cx="80" cy="70" r="7" style="fill:var(--af);stroke:var(--as);stroke-width:2"/></g><text class="s" x="80" y="48" style="fill:var(--ink)">spec 草稿</text>
<g class="u"><circle cx="170" cy="70" r="7" style="fill:var(--uf);stroke:var(--us);stroke-width:2"/></g><text class="s" x="170" y="48" style="fill:var(--ink)">spec 已确认</text>
<g class="a"><circle cx="340" cy="70" r="7" style="fill:var(--af);stroke:var(--as);stroke-width:2"/></g><text class="s" x="340" y="48" style="fill:var(--ink)">HANDOFF</text>
<g class="a"><circle cx="280" cy="150" r="7" style="fill:var(--af);stroke:var(--as);stroke-width:2"/></g><text class="s" x="280" y="174" style="fill:var(--ink)">T1 + 勾验收</text>
<g class="a"><circle cx="420" cy="150" r="7" style="fill:var(--af);stroke:var(--as);stroke-width:2"/></g><text class="s" x="420" y="174" style="fill:var(--ink)">T2 + 勾验收</text>
<g class="u"><circle cx="540" cy="70" r="7" style="fill:var(--uf);stroke:var(--us);stroke-width:2"/></g><text class="s" x="540" y="48" style="fill:var(--ink)">合并</text>
<g class="a"><circle cx="620" cy="70" r="7" style="fill:var(--af);stroke:var(--as);stroke-width:2"/></g><text class="s" x="620" y="48" style="fill:var(--ink)">HANDOFF</text>
</svg>
