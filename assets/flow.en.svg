<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 770" width="680" height="770" role="img" aria-labelledby="flow-en-title flow-en-desc">
<title id="flow-en-title">Main flow</title>
<desc id="flow-en-desc">Open a session in a project environment or the workspace, route by one of three openers, approve the spec, build on a branch, approve the merge, then return to main and wrap up.</desc>
<style>
svg{--ink:#1f2328;--mut:#59636e;--line:#d1d9e0;--flow:#1a7f37;--uf:#fbefff;--us:#8250df;--ut:#512a97;--af:#dafbe1;--as:#1a7f37;--at:#0f5323;--gf:#f6f8fa;--gs:#d1d9e0}
@media (prefers-color-scheme:dark){svg{--ink:#f0f6fc;--mut:#9198a1;--line:#3d444d;--flow:#3fb950;--uf:#271a3f;--us:#a371f7;--ut:#e2d1ff;--af:#0f2a1a;--as:#3fb950;--at:#aff5b4;--gf:#151b23;--gs:#3d444d}}
text{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;text-anchor:middle;dominant-baseline:central}
.t{font-size:14px;font-weight:600}.s{font-size:12px}
.u rect{fill:var(--uf);stroke:var(--us)}.u .t{fill:var(--ut)}.u .s{fill:var(--us)}
.a rect{fill:var(--af);stroke:var(--as)}.a .t{fill:var(--at)}.a .s{fill:var(--as)}
.g rect{fill:var(--gf);stroke:var(--gs)}.g .t{fill:var(--ink)}.g .s{fill:var(--mut)}
rect{stroke-width:1}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.f{fill:none;stroke:var(--flow);stroke-width:2;stroke-dasharray:6 8;animation:flow 1s linear infinite}
.n{animation:pulse 7.2s ease-in-out infinite both}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:.55}4%,10%{opacity:1}14%,99%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.f,.n{animation:none;opacity:1}}
.lg{font-size:12px;fill:var(--mut);text-anchor:start}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--mut)" stroke-width="1.5" stroke-linecap="round"/></marker></defs>
<path class="e" d="M340 76V96H140V114" marker-end="url(#ah)"/>
<path class="e" d="M340 76V114" marker-end="url(#ah)"/>
<path class="e" d="M340 96H540V114" marker-end="url(#ah)"/>
<path class="e" d="M140 172V210" marker-end="url(#ah)"/>
<path class="e" d="M340 172V210" marker-end="url(#ah)"/>
<path class="e" d="M540 172V210" marker-end="url(#ah)"/>
<path class="e" d="M450 240H434" marker-end="url(#ah)"/>
<path class="e" d="M140 268V432H148" marker-end="url(#ah)"/>
<path class="e" d="M340 268V306" marker-end="url(#ah)"/>
<path class="e" d="M340 364V402" marker-end="url(#ah)"/>
<path class="e" d="M340 460V498" marker-end="url(#ah)"/>
<path class="e" d="M340 556V594" marker-end="url(#ah)"/>
<path class="e" d="M340 652V690" marker-end="url(#ah)"/>
<path class="f" d="M340 76V114"/><path class="f" d="M340 172V210"/><path class="f" d="M340 268V306"/><path class="f" d="M340 364V402"/><path class="f" d="M340 460V498"/><path class="f" d="M340 556V594"/><path class="f" d="M340 652V690"/>
<g class="g n" style="animation-delay:0s"><rect x="210" y="20" width="260" height="56" rx="8"/><text class="t" x="340" y="38">Open a session</text><text class="s" x="340" y="58">in a project environment or workspace</text></g>
<g class="u"><rect x="50" y="116" width="180" height="56" rx="8"/><text class="t" x="140" y="134">“continue my-app”</text><text class="s" x="140" y="154">resume work</text></g>
<g class="u n" style="animation-delay:.9s"><rect x="250" y="116" width="180" height="56" rx="8"/><text class="t" x="340" y="134">“my-app: add X”</text><text class="s" x="340" y="154">make a request</text></g>
<g class="u"><rect x="450" y="116" width="180" height="56" rx="8"/><text class="t" x="540" y="134">“new project: X”</text><text class="s" x="540" y="154">start from scratch</text></g>
<g class="a"><rect x="50" y="212" width="180" height="56" rx="8"/><text class="t" x="140" y="230">Find the active spec</text><text class="s" x="140" y="250">read HANDOFF</text></g>
<g class="a n" style="animation-delay:1.8s"><rect x="250" y="212" width="180" height="56" rx="8"/><text class="t" x="340" y="230">Route to a spec</text><text class="s" x="340" y="250">write or extend a spec</text></g>
<g class="a"><rect x="450" y="212" width="180" height="56" rx="8"/><text class="t" x="540" y="230">Scaffold the project</text><text class="s" x="540" y="250">git init, add to index</text></g>
<g class="u n" style="animation-delay:2.7s"><rect x="250" y="308" width="180" height="56" rx="8"/><text class="t" x="340" y="326">“go ahead”</text><text class="s" x="340" y="346">spec approved</text></g>
<g class="a n" style="animation-delay:3.6s"><rect x="150" y="404" width="380" height="56" rx="8"/><text class="t" x="340" y="422">Build on a feature branch</text><text class="s" x="340" y="442">isolated worktree, saved after every step</text></g>
<g class="u n" style="animation-delay:4.5s"><rect x="210" y="500" width="260" height="56" rx="8"/><text class="t" x="340" y="518">“merge”</text><text class="s" x="340" y="538">tests pass, acceptance checked</text></g>
<g class="a n" style="animation-delay:5.4s"><rect x="210" y="596" width="260" height="56" rx="8"/><text class="t" x="340" y="614">Merge into main</text><text class="s" x="340" y="634">update HANDOFF, delete branch</text></g>
<g class="u n" style="animation-delay:6.3s"><rect x="210" y="692" width="260" height="56" rx="8"/><text class="t" x="340" y="710">“wrap up” (optional)</text><text class="s" x="340" y="730">archive, give the next opener</text></g>
<g class="u"><rect x="500" y="702" width="12" height="12" rx="2"/></g><text class="lg" x="518" y="708">you say</text>
<g class="a"><rect x="500" y="726" width="12" height="12" rx="2"/></g><text class="lg" x="518" y="732">agent does</text>
</svg>
